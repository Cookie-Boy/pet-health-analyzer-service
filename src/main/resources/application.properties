spring.application.name=pet_health_analyzer
server.port=8084

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/vet-clinic
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
#spring.liquibase.drop-first=true
spring.liquibase.default-schema=analysis

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/clinic-realm}
spring.security.oauth2.client.registration.health-analyzer.client-id=pet-health-analyzer-service
spring.security.oauth2.client.registration.health-analyzer.client-secret=${KEYCLOAK_CLIENT_SECRET:KndP9iogTlX3TrdkzuPWgZYzztsp9o8D}
spring.security.oauth2.client.registration.health-analyzer.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.health-analyzer.provider=keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/clinic-realm}

mqtt.broker=tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
mqtt.client-id=pet-analyzer-client
mqtt.inbound.topic=pet/vitals
mqtt.outbound.topic=pet/anomalies

thresholds.heart-rate-max=200
thresholds.heart-rate-min=30
thresholds.respiration-max=40
thresholds.respiration-min=10
thresholds.temperature-max=41.0
thresholds.temperature-min=36.0
thresholds.distance-from-home-max=10

gateway.url=http://${GATEWAY_HOST:localhost}:${GATEWAY_PORT:8888}

